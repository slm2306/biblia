info:
  name: Consultar pasaje
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8081/api/versiculos?libro=Juan&capitulo=3
  params:
    - name: libro
      value: Juan
      type: query
    - name: capitulo
      value: "3"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
